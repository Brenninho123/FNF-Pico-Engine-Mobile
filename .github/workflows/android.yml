name: Build Android

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    name: Android APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses
        run: |
          mkdir -p $ANDROID_HOME/licenses
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" >  $ANDROID_HOME/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> $ANDROID_HOME/licenses/android-sdk-license
          echo "84831b9409646a918e30573bab4c9c91346d8abd" >> $ANDROID_HOME/licenses/android-sdk-license
          echo "33b6a2b64607f11b759f320ef9dff4ae5c47d97a" >  $ANDROID_HOME/licenses/android-sdk-preview-license
          echo "504667f4c0de7af1a06de9f4b1727b84351f2910" >  $ANDROID_HOME/licenses/intel-android-extra-license

      - name: Setup Android SDK components
        run: |
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --update
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;26.3.11579264" \
            "platform-tools"

      - name: Setup Haxe 4.3.7
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.7

      - name: Install haxelibs
        run: |
          haxelib install lime 8.1.2 --quiet
          haxelib install openfl 9.3.3 --quiet
          haxelib install flixel 5.6.1 --quiet
          haxelib install flixel-addons 3.2.2 --quiet
          haxelib install tjson 1.4.0 --quiet
          haxelib install hxvlc 2.0.1 --quiet
          haxelib install flxanimate --quiet
          haxelib install extension-androidtools --quiet
          haxelib run lime setup -alias -y

      - name: Write hxcpp Android config
        run: |
          NDK_PATH="$ANDROID_HOME/ndk/26.3.11579264"
          CONFIG_FILE="$HOME/.hxcpp_config.xml"
          cat > "$CONFIG_FILE" << XMLEOF
          <xml>
            <section id="vars">
              <set name="ANDROID_SDK"      value="$ANDROID_HOME" />
              <set name="ANDROID_NDK_ROOT" value="$NDK_PATH" />
              <set name="JAVA_HOME"        value="$JAVA_HOME" />
              <set name="ANDROID_SETUP"    value="1" />
            </section>
          </xml>
          XMLEOF
          echo "Wrote $CONFIG_FILE"
          cat "$CONFIG_FILE"

      - name: Write Lime Android config
        run: |
          NDK_PATH="$ANDROID_HOME/ndk/26.3.11579264"
          LIME_CONFIG="$HOME/.lime/config.json"
          mkdir -p "$(dirname $LIME_CONFIG)"
          cat > "$LIME_CONFIG" << JSONEOF
          {
            "ANDROID_SDK": "$ANDROID_HOME",
            "ANDROID_NDK_ROOT": "$NDK_PATH",
            "JAVA_HOME": "$JAVA_HOME",
            "ANDROID_SETUP": true
          }
          JSONEOF
          echo "Wrote $LIME_CONFIG"
          cat "$LIME_CONFIG"

      - name: Create missing asset directories
        run: |
          mkdir -p assets/shared
          mkdir -p assets/embed
          mkdir -p assets/songs
          mkdir -p assets/fonts
          mkdir -p assets/videos
          mkdir -p assets/week_assets
          mkdir -p assets/funkin_assets
          touch assets/shared/.gitkeep
          touch assets/embed/.gitkeep
          touch assets/songs/.gitkeep
          touch assets/fonts/.gitkeep
          touch assets/videos/.gitkeep
          touch assets/week_assets/.gitkeep
          touch assets/funkin_assets/.gitkeep

      - name: Build APK
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
          ANDROID_NDK_ROOT: ${{ env.ANDROID_HOME }}/ndk/26.3.11579264
        run: haxelib run lime build android -final -no-debug

      - name: Locate and rename APK
        run: |
          APK=$(find export/release/android -name "*.apk" | head -1)
          cp "$APK" Pico-Engine-Android.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pico-Engine-Android
          path: Pico-Engine-Android.apk
          if-no-files-found: error
