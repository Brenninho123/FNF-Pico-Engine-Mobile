name: Build Android

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    name: Android APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools-version: 34.0.0
          ndk-version: 26.3.11579264

      - name: Setup Haxe 4.3.7
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.7

      - name: Install haxelibs
        run: |
          haxelib install lime 8.3.2 --quiet
          haxelib install openfl 9.3.3 --quiet
          haxelib install flixel 5.6.1 --quiet
          haxelib install flixel-addons 3.2.2 --quiet
          haxelib install tjson 1.4.0 --quiet
          haxelib install hxvlc 2.0.1 --quiet
          haxelib install flxanimate --quiet
          haxelib install extension-androidtools --quiet
          haxelib run lime setup -alias -y

      - name: Setup Android target
        run: haxelib run lime setup android -y

      - name: Build APK
        run: haxelib run lime build android -final -no-debug

      - name: Sign APK (release)
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASS:   ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS:       ${{ secrets.KEY_ALIAS }}
          KEY_PASS:        ${{ secrets.KEY_PASS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore
          UNSIGNED=$(find export/release/android -name "*.apk" | head -1)
          $ANDROID_HOME/build-tools/34.0.0/zipalign -v 4 "$UNSIGNED" aligned.apk
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
            --ks release.keystore \
            --ks-pass "pass:$KEYSTORE_PASS" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "pass:$KEY_PASS" \
            --out Pico-Engine-Android.apk \
            aligned.apk

      - name: Copy unsigned APK
        if: ${{ secrets.KEYSTORE_BASE64 == '' }}
        run: |
          cp $(find export/release/android -name "*.apk" | head -1) Pico-Engine-Android.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pico-Engine-Android
          path: Pico-Engine-Android.apk
          if-no-files-found: error
